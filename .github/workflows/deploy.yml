# On every push to main: run the tests, pack the bot with its libraries into one tarball and upload it to the
# production server, which installs it and restarts the bot (going back by itself if the new version doesn't start).
# See "Deployment" in README.md for the one-time setup. Nothing is published anywhere: the tarball only goes to the server.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # run by hand (tests and deploys the selected branch head)

# One deployment at a time; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The Python of the server's container (variable minionbot_python in the minions repository): the libraries are
  # downloaded for exactly this version. Change both together.
  PYTHON_VERSION: "3.15"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Run the tests (a failure stops the deployment)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Pack the release (the code and the libraries for the server's Python)
        run: |
          mkdir release
          cp -r minionbot main.py requirements.txt release/
          find release -name __pycache__ -prune -exec rm -rf {} +
          # The version the bot reports in its start message
          printf '{"commit": "%s", "date": "%s"}\n' "$GITHUB_SHA" "$(git log -1 --format=%cI)" > release/minionbot/version.json
          cd release
          # Wheels for the server (Debian 12, glibc 2.36, x86-64) whatever the runner is; only prebuilt wheels
          python -m pip install --no-compile --target deps --only-binary=:all: \
            --python-version "$PYTHON_VERSION" --implementation cp --abi "cp${PYTHON_VERSION/./}" \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_34_x86_64 --platform manylinux_2_35_x86_64 --platform manylinux_2_36_x86_64 \
            -r requirements.txt
          rm -rf deps/bin                  # command-line scripts of the libraries: not needed, and they point at the runner's Python
          # The release is read-only on the server: compile now, and never check the sources again
          python -m compileall -q -j0 --invalidation-mode unchecked-hash minionbot deps
          # No links are allowed in a release; --hard-dereference stores hard-linked files as normal ones
          tar --format=gnu --sort=name --owner=0 --group=0 --numeric-owner --hard-dereference -czf ../release.tar.gz \
            minionbot main.py requirements.txt deps
          cd ..
          ls -l release.tar.gz
          sha256sum release.tar.gz

      # Skipped (tests only) until the server is set up: repository variable DEPLOY_URL, see README.
      - name: Upload the release to the server
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}              # https://example.com/hooks/minionbot
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}     # shared HMAC key, same value as on the server
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/^.* //'; }
          digest=$(sha256sum release.tar.gz | cut -d' ' -f1)
          length=$(stat -c %s release.tar.gz)
          for attempt in 1 2 3; do
            ts=$(date +%s)
            if curl -fsS --max-time 600 -X POST -H 'Expect:' \
                 -H "X-Commit: $SHA" -H "X-Timestamp: $ts" -H "X-Content-SHA256: $digest" \
                 -H "X-Signature-256: sha256=$(sign "deploy:$SHA:$ts:$digest:$length")" \
                 -H 'Content-Type: application/gzip' --data-binary @release.tar.gz "$DEPLOY_URL/deploy"; then
              echo; break
            fi
            [ "$attempt" = 3 ] && { echo "::error::The server did not accept the upload"; exit 1; }
            echo "upload failed, trying again"; sleep 10
          done

      - name: Wait for the server to switch (it goes back to the previous version when the new one doesn't start)
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/^.* //'; }
          for _ in $(seq 90); do
            sleep 5
            ts=$(date +%s)
            out=$(curl -fsS --retry 2 --retry-all-errors --max-time 20 \
              -H "X-Signature-256: sha256=$(sign "status:$SHA:$ts")" \
              "$DEPLOY_URL/status?sha=$SHA&ts=$ts" || true)
            echo "status: $out"
            got=$(printf '%s' "$out" | jq -r '.sha // empty' 2>/dev/null || true)
            state=$(printf '%s' "$out" | jq -r '.state // empty' 2>/dev/null || true)
            # The server reports on its latest request: another commit there means a newer push took over.
            if [ -n "$got" ] && [ "$got" != "$SHA" ]; then
              echo "A newer commit was requested meanwhile; its own run reports the result"; exit 0
            fi
            case "$state" in
              ok)     echo "Deployed $SHA"; exit 0 ;;
              failed) echo "::error::The server could not run $SHA: $(printf '%s' "$out" | jq -r .detail)"; exit 1 ;;
            esac
          done
          echo "::error::No result from the server after 7 minutes"
          exit 1
